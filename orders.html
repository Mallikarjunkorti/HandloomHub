<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders | HandloomHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/navbar.css">
<link rel="stylesheet" href="css/orders.css">
</head>
<body>

<header>
    <nav>
        <h2>HandloomHub</h2>

        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="cart.html">Cart</a></li>
            <li><a href="wishlist.html">Wishlist</a></li>
        </ul>
    </nav>
</header>

<section class="orders-page">

    <div class="container">

        <div class="orders-header">

            <h1>📦 My Orders</h1>

            <p>

                Track your purchases and explore the journey of every handcrafted product.

            </p>

        </div>

        <!-- Summary -->

        <div class="orders-summary">

            <div class="summary-card">

                <h2 id="totalOrders">0</h2>

                <span>Total Orders</span>

            </div>

            <div class="summary-card">

                <h2 id="processingOrders">0</h2>

                <span>Processing</span>

            </div>

            <div class="summary-card">

                <h2 id="shippedOrders">0</h2>

                <span>Shipped</span>

            </div>

            <div class="summary-card">

                <h2 id="deliveredOrders">0</h2>

                <span>Delivered</span>

            </div>

        </div>

        <!-- Search -->

        <div class="orders-toolbar">

            <input

                type="text"

                id="orderSearch"

                placeholder="🔍 Search Order ID or Product">

        </div>

        <div id="ordersContainer">

        </div>

    </div>

</section>
<!-- Track Order Modal -->

<div id="trackModal" class="modal">

    <div class="modal-content">

        <span id="closeTrackModal" class="close-modal">&times;</span>

        <h2>📦 Order Tracking</h2>

        <div id="trackingContent"></div>

    </div>

</div>

<div id="toast" class="toast">
    <span id="toastMessage"></span>
</div>
<script src="js/components/toast.js"></script>
<script src="js/storage.js"></script>
<script src="js/components/navbar.js"></script>
<script src="js/script.js"></script>

<script src="js/orders.js"></script>

</body>
</html>
